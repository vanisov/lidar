name: Feature request
description: Suggest a tool or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not just the feature. "I want to check X without opening DevTools" helps more than "add Y".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Lidar to do?
  - type: textarea
    id: elsewhere
    attributes:
      label: Seen it elsewhere?
      description: Another tool that does this well, if any.
