name: Site

# Builds the website in site/ and, on main, deploys it to Cloudflare. Runs only when site/ changes; the
# extension's CI skips those changes. To redeploy after changing something the site reads from outside site/
# (store/out, brand/, CHANGELOG.md, PRIVACY.md), run this workflow by hand.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Build and deploy site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx astro check
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: site
          wranglerVersion: '4.148.0'
          command: deploy
