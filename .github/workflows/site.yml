name: Site

# Builds the Astro site in site/ and deploys it to GitHub Pages. The site also reads the store screenshots and
# video, the brand icons, CHANGELOG.md and PRIVACY.md, so a change to any of them redeploys it.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'store/out/**'
      - 'brand/**'
      - 'CHANGELOG.md'
      - 'PRIVACY.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Where Pages serves the site: https://vanisov.github.io + /lidar, or the custom domain once it's set.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
