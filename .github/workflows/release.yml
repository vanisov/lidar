name: Release

# Merging a PR that adds a new "## [X.Y.Z]" section to CHANGELOG.md releases it: tag, GitHub release, Chrome Web
# Store upload. Pushing a vX.Y.Z tag by hand reruns a release.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find a version to release
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$VERSION" ] || git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Nothing to release: the newest changelog version (${VERSION:-none}) is already tagged."
            exit 0
          fi
          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    environment: chrome-web-store
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: The version in package.json matches the changelog
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error file=package.json::package.json says $PKG but CHANGELOG.md releases $VERSION. Bump package.json in the release PR."
            exit 1
          fi

      - name: Build
        run: npm run package

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          cat >> notes.md <<'NOTES'

          **Install:** get Lidar from the Chrome Web Store (updates arrive automatically), or download `lidar.zip`, unzip it, and load the folder at `chrome://extensions` → Developer mode → Load unpacked.
          NOTES

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" lidar.zip --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" lidar.zip --title "Lidar $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi

      - name: Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/publish-cws.mjs lidar.zip "$VERSION"
