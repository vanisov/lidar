<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lidar fixture</title>
<style nonce="fixture">
  html { transform: translateZ(0); }
  * { font-family: "Comic Sans MS", cursive !important; box-sizing: border-box !important; }
  body { margin: 0; background: #f6f5f2; color: #1d1d1d; }
  .hero { padding: 40px 64px; }
  h1 { margin: 0 0 20px; font-size: 40px; }
  .cta { display: inline-block; padding: 13px 22px; margin-right: 10px; background: #1d1d1d; color: #fff; border-radius: 10px; font-size: 14px; text-decoration: none; }
  .ghost { display: inline-block; padding: 12px 20px; border: 1px solid #ccc; border-radius: 10px; color: #1d1d1d; }
  .row { display: flex; gap: 20px; padding: 0 64px; }
  .card { width: 200px; height: 100px; background: #fff; }
  .tall { height: 2400px; margin: 40px 64px; background: linear-gradient(#eee, #ccc); }
</style>
</head>
<body>
  <section class="hero">
    <h1 id="title">Ship calmer software.</h1>
    <a class="cta" href="https://example.com/">Start free</a><a class="ghost" href="https://example.com/demo">Book a demo</a>
    <input id="q" placeholder="Search">
  </section>
  <div class="row"><div class="card" id="c1">One</div><div class="card" id="c2">Two</div><div class="card" id="c3">Three</div></div>
  <div class="tall" id="tall"></div>
</body>
</html>
